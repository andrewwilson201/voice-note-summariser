<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voice Summary</title>
<meta name="description" content="Share a WhatsApp voice note and get a short summary.">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f6f7f6;--card:#fff;--text:#16201e;--muted:#5d6b68;--line:#e2e7e5;--accent:#0f766e;--accent-ink:#fff;--soft:#e6f2f0;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0f1514;--card:#18201f;--text:#e8eeec;--muted:#9aa8a5;--line:#2a3533;--accent:#2dd4bf;--accent-ink:#04211d;--soft:#16302c;--err:#f97066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 8px;font-weight:600}
#current,#setup{display:block;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);padding:8px;border:1px solid var(--line)}
button:disabled{opacity:.5}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
#status{display:flex;gap:10px;align-items:center;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:r 0.8s linear infinite;flex:none}
@keyframes r{to{transform:rotate(360deg)}}
.summary{font-size:17px;white-space:pre-wrap}
.summary ul{margin:8px 0 0;padding-left:20px}
details{margin-top:12px;font-size:14px;color:var(--muted)}
details p{white-space:pre-wrap;margin:8px 0 0}
.err{color:var(--err)}
.empty{text-align:center;padding:28px 16px}
.empty p{color:var(--muted);margin:0 0 16px}
.hist{display:flex;flex-direction:column;gap:10px}
.hist .card{padding:12px 14px}
.when{font-size:12px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>Voice Summary</h1>
    <button class="ghost" id="settingsBtn" aria-label="Settings">Settings</button>
  </header>

  <section id="setup" class="card" hidden>
    <strong>Set up</strong>
    <label for="key">Claude API key</label>
    <input id="key" type="password" autocomplete="off" placeholder="sk-ant-...">
    <p class="hint">Stored only on this phone. Used to send the transcript (text only) to Claude.</p>
    <label for="model">Speech recognition</label>
    <select id="model">
      <option value="onnx-community/whisper-tiny">Fastest (lower accuracy)</option>
      <option value="onnx-community/whisper-base" selected>Balanced</option>
      <option value="onnx-community/whisper-small">Most accurate (slower, bigger download)</option>
    </select>
    <p class="hint">The speech model downloads once (about 80 MB for Balanced) and then runs on the phone.</p>
    <div class="row" style="margin-top:14px"><span></span><button id="save">Save</button></div>
  </section>

  <section id="current" hidden>
    <div class="card">
      <div id="status"><div class="spin"></div><span id="statusText">Working…</span></div>
      <div id="result" hidden>
        <div class="summary" id="summary"></div>
        <details><summary>Full transcript</summary><p id="transcript"></p></details>
      </div>
    </div>
  </section>

  <section id="empty" class="card empty">
    <p>In WhatsApp, long-press a voice note, tap <b>Share</b>, and choose <b>Voice Summary</b>.</p>
    <label class="btn" for="file" style="display:inline-block;color:var(--accent-ink);margin:0">Or pick an audio file</label>
    <input id="file" type="file" accept="audio/*,.opus,.ogg,.m4a,.mp3,.wav" hidden>
  </section>

  <section id="historyWrap" hidden>
    <h2>Recent</h2>
    <div class="hist" id="history"></div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
